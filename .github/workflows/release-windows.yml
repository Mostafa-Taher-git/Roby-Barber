name: release-windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype renderer
        run: npm install
        working-directory: apps-prototype
      - name: Build renderer
        run: npm run build
        working-directory: apps-prototype
      - name: Install desktop deps
        run: npm install
        working-directory: apps-desktop
      - name: Build main process
        run: npm run build:main
        working-directory: apps-desktop
      - name: Seed check (counts only, no commit)
        run: npm run seed
        working-directory: apps-desktop
      - name: Build NSIS installer (Windows x64)
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: apps-desktop
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobyBarber-Windows
          path: apps-desktop/dist/*.exe
