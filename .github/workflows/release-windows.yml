name: release-windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ROBY_LOG_DIR: ${{ github.workspace }}\logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Renderer (React + offline Cairo font)
      - name: Install renderer deps
        run: npm install
        working-directory: apps-desktop/src-renderer
      - name: Build renderer
        run: npm run build
        working-directory: apps-desktop/src-renderer

      # Main process + native SQLite
      - name: Install desktop deps
        run: npm install
        working-directory: apps-desktop
      # One ABI everywhere: native module matches Electron, so packaged app + tests agree
      - name: Rebuild better-sqlite3 for Electron ABI
        run: npm run rebuild:native
        working-directory: apps-desktop
      - name: Build main process
        run: npm run build:main
        working-directory: apps-desktop

      # Gate: the full smoke suite (all phases) must pass before any release build
      - name: Smoke tests (all phases)
        run: npm run smoke
        working-directory: apps-desktop
      - name: Seed check (counts only)
        run: npm run seed
        working-directory: apps-desktop

      # Package Windows x64 installer
      - name: Verify tag matches package version
        shell: pwsh
        working-directory: apps-desktop
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { Write-Error "tag $tag != package.json version $pkg"; exit 1 }
          Write-Host "tag/version OK: $tag"

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        working-directory: apps-desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobyBarber-Windows
          path: apps-desktop/dist/*.exe

      # GitHub Release with the installer attached (tag push = release)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Roby Barber ${{ github.ref_name }}
          generate_release_notes: true
          files: apps-desktop/dist/*.exe
